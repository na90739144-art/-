name: Unpack project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into folders
        run: |
          unzip -q -o project.zip -d _tmp
          cp -a _tmp/kafinet/. .
          rm -rf _tmp project.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project into folders"
          git push
